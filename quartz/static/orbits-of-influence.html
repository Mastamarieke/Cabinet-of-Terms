<script>
const svg=document.querySelector("svg");
const set=(c,on)=>{svg.classList.toggle("focus",on);
  for(const e of svg.querySelectorAll(".e")) e.classList.toggle("on",on&&e.dataset.c.includes(" "+c+" "));
  for(const g of svg.querySelectorAll(".cl,.lg,.dl")) g.classList.toggle("on",on&&g.dataset.c==c);};
for(const g of svg.querySelectorAll(".cl,.lg")){
  g.addEventListener("mouseenter",()=>set(g.dataset.c,true));
  g.addEventListener("mouseleave",()=>set(g.dataset.c,false));
  g.addEventListener("focus",()=>set(g.dataset.c,true));
  g.addEventListener("blur",()=>set(g.dataset.c,false));}
</script>

<script>
// The camera (14-10): the map as you see it now, highlighted cluster included. The page's
// stylesheet does not travel with an SVG turned into an image, so what the CSS decides
// (hidden names, faded lines, the bold legend entry) is written into the copy first.
document.querySelector(".shot-btn").addEventListener("click",()=>{
  // read the end state of the fade, not a moment halfway through it
  document.body.classList.add("no-anim"); void document.body.offsetHeight;
  const src=document.querySelector("svg"), copy=src.cloneNode(true);
  const a=[...src.querySelectorAll("*")], b=[...copy.querySelectorAll("*")];
  for(let i=a.length-1;i>=0;i--){const cs=getComputedStyle(a[i]);
    if(cs.display==="none"){b[i].remove();continue}
    if(cs.opacity!=="1")b[i].setAttribute("opacity",cs.opacity);
    if(a[i].tagName==="path"&&a[i].classList.contains("e"))b[i].setAttribute("stroke-width",cs.strokeWidth);
    if(a[i].tagName==="text"||a[i].tagName==="tspan"){b[i].setAttribute("fill",cs.fill);b[i].setAttribute("font-weight",cs.fontWeight)}}
  document.body.classList.remove("no-anim");
  const vb=src.viewBox.baseVal; copy.setAttribute("width",vb.width); copy.setAttribute("height",vb.height);
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas"); c.width=vb.width; c.height=vb.height;
    const g=c.getContext("2d"); g.fillStyle="#faf8f8"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0);
    c.toBlob(bl=>{const l=document.createElement("a"); l.href=URL.createObjectURL(bl); l.download="orbits-of-influence.png"; l.click(); setTimeout(()=>URL.revokeObjectURL(l.href),2000)},"image/png")};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(copy));
});
</script>
